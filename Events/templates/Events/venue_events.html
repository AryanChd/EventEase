{% extends 'Events/Base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h1 class="h3 mb-0">Venue Events</h1>
                    <p class="mb-0 text-white-50">Events scheduled at this venue</p>
                </div>
                <div class="card-body">
                    {% if events %}
                        <div class="list-group list-group-flush">
                            {% for event in events %}
                                <a href="{% url 'show-event' event.id %}" class="list-group-item list-group-item-action d-flex align-items-center py-3">
                                    <i class="fas fa-calendar-alt me-3 text-primary"></i>
                                    <div>
                                        <h5 class="mb-1">{{ event }}</h5>
                                        <p class="mb-0 text-muted">
                                            <i class="fas fa-clock me-2"></i>{{ event.event_date }}
                                        </p>
                                    </div>
                                </a>
                            {% endfor %}
                        </div>
                    {% else %}
                        <div class="text-center py-4">
                            <i class="fas fa-calendar-times fa-3x text-muted mb-3"></i>
                            <h3 class="h4 text-muted mb-2">No Events Found</h3>
                            <p class="text-muted mb-0">This venue currently has no scheduled events.</p>
                        </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .card {
        border: none;
        border-radius: 12px;
    }
    
    .card-header {
        border-radius: 12px 12px 0 0 !important;
        background-color: var(--primary-color) !important;
        padding: 1.25rem;
    }
    
    .list-group-item {
        border: none;
        border-bottom: 1px solid #eee;
        transition: all 0.3s ease;
    }
    
    .list-group-item:hover {
        background-color: #f8f9fa;
        transform: translateX(5px);
    }
    
    .list-group-item:last-child {
        border-bottom: none;
    }
    
    .text-primary {
        color: var(--primary-color) !important;
    }
    
    .text-muted {
        color: #666 !important;
    }
</style>
{% endblock %}
